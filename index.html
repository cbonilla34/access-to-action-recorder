<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ACCESS to Action - Microphone Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      margin: 0;
      padding: 24px;
      text-align: center;
      color: #1f2937;
    }

    .card {
      max-width: 520px;
      margin: 40px auto;
      background: white;
      padding: 28px;
      border-radius: 22px;
      box-shadow: 0 6px 24px rgba(0,0,0,.10);
    }

    h1 {
      color: #17365d;
      margin-bottom: 8px;
    }

    .status {
      padding: 14px;
      margin: 22px 0;
      border-radius: 12px;
      background: #eef3f8;
      font-weight: bold;
    }

    button {
      display: block;
      width: 100%;
      padding: 18px;
      margin: 12px 0;
      border: 0;
      border-radius: 14px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    #recordBtn {
      background: #b42318;
      color: white;
    }

    #stopBtn {
      background: #374151;
      color: white;
    }

    #stopBtn:disabled {
      opacity: .4;
    }

    audio {
      width: 100%;
      margin-top: 20px;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    .small {
      font-size: 14px;
      color: #6b7280;
      margin-top: 20px;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>ACCESS to Action</h1>
    <h2>Microphone Test</h2>

    <p>This test checks whether this device can record audio.</p>

    <div id="status" class="status">
      Ready to test.
    </div>

    <button id="recordBtn">🎤 Start Recording</button>
    <button id="stopBtn" disabled>■ Stop Recording</button>

    <audio id="playback" controls hidden></audio>

    <p class="small">
      This test does not upload or permanently save your recording.
    </p>
  </div>

  <script>
    let mediaRecorder;
    let audioChunks = [];
    let stream;

    const recordBtn = document.getElementById("recordBtn");
    const stopBtn = document.getElementById("stopBtn");
    const playback = document.getElementById("playback");
    const statusBox = document.getElementById("status");

    recordBtn.addEventListener("click", async () => {
      try {
        statusBox.className = "status";
        statusBox.textContent = "Requesting microphone access...";

        stream = await navigator.mediaDevices.getUserMedia({ audio: true });

        audioChunks = [];
        mediaRecorder = new MediaRecorder(stream);

        mediaRecorder.addEventListener("dataavailable", event => {
          if (event.data.size > 0) {
            audioChunks.push(event.data);
          }
        });

        mediaRecorder.addEventListener("stop", () => {
          const audioBlob = new Blob(audioChunks, {
            type: mediaRecorder.mimeType
          });

          const audioURL = URL.createObjectURL(audioBlob);

          playback.src = audioURL;
          playback.hidden = false;

          statusBox.className = "status success";
          statusBox.textContent =
            "Recording complete. Press Play below and make sure you can hear yourself.";

          if (stream) {
            stream.getTracks().forEach(track => track.stop());
          }
        });

        mediaRecorder.start();

        recordBtn.disabled = true;
        stopBtn.disabled = false;

        statusBox.className = "status success";
        statusBox.textContent = "Recording now... say something for about 10 seconds.";

      } catch (error) {
        console.error(error);

        statusBox.className = "status error";

        if (error.name === "NotAllowedError") {
          statusBox.textContent =
            "Microphone access was blocked or denied.";
        } else if (error.name === "NotFoundError") {
          statusBox.textContent =
            "No microphone was found on this device.";
        } else {
          statusBox.textContent =
            "Microphone test failed: " + error.name;
        }
      }
    });

    stopBtn.addEventListener("click", () => {
      if (mediaRecorder && mediaRecorder.state === "recording") {
        mediaRecorder.stop();
      }

      recordBtn.disabled = false;
      stopBtn.disabled = true;
    });
  </script>
</body>
</html>
