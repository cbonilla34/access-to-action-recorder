<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ACCESS to Action Recorder</title>
  <style>
    :root{--navy:#17365d;--green:#18794e;--greenbg:#eaf8f0;--red:#b42318;--redbg:#fff0ee;--ink:#172033;--muted:#667085;--line:#dce3ec;--bg:#f4f7fb}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}
    .card{width:min(520px,100%);background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 12px 36px rgba(23,54,93,.10)}
    .head{background:var(--navy);color:#fff;padding:22px}
    .head h1{margin:0;font-size:24px}.head p{margin:6px 0 0;opacity:.82;font-size:13px}
    .body{padding:22px}.label{font-size:11px;font-weight:900;text-transform:uppercase;color:var(--muted);letter-spacing:.05em}
    .task{font-size:19px;font-weight:800;margin:5px 0 18px}
    .state{border-radius:14px;padding:16px;text-align:center;background:#f8fafc;border:1px solid var(--line)}
    .state.recording{background:var(--redbg);border-color:#f0b5af}.state.complete{background:var(--greenbg);border-color:#acd9bd}
    .dot{width:12px;height:12px;border-radius:50%;background:#98a2b3;display:inline-block;margin-right:7px}.recording .dot{background:var(--red)}.complete .dot{background:var(--green)}
    .status{font-weight:900}.recording .status{color:var(--red)}.complete .status{color:var(--green)}
    .timer{font-size:34px;font-weight:800;margin:10px 0 2px;font-variant-numeric:tabular-nums}
    .main{width:100%;min-height:52px;border:0;border-radius:12px;background:var(--navy);color:#fff;font-weight:900;font-size:16px;margin-top:16px;cursor:pointer}
    .main.stop{background:var(--red)}.main:disabled{background:#aeb8c6;cursor:not-allowed}
    audio{width:100%;margin-top:16px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
    .secondary,.use{min-height:46px;border-radius:11px;font-weight:900;cursor:pointer}.secondary{background:#fff;border:1px solid #cbd5e1;color:var(--navy)}.use{border:0;background:var(--green);color:#fff}
    .use:disabled,.secondary:disabled{opacity:.5;cursor:not-allowed}.note{font-size:11px;line-height:1.45;color:var(--muted);margin-top:18px;text-align:center}
    .error{display:none;background:var(--redbg);color:var(--red);padding:10px;border-radius:9px;margin-top:12px;font-size:12px;font-weight:700}
  </style>
</head>
<body>
  <div class="card">
    <div class="head"><h1>ACCESS to Action</h1><p>Secure Audio Recorder</p></div>
    <div class="body">
      <div class="label">Recording for</div>
      <div class="task" id="taskLabel">Teacher recording</div>
      <div class="state" id="stateBox"><div><span class="dot"></span><span class="status" id="status">Ready to record</span></div><div class="timer" id="timer">0:00</div></div>
      <button class="main" id="recordBtn">Start Recording</button>
      <audio id="player" controls hidden></audio>
      <div class="actions" id="actions" hidden><button class="secondary" id="againBtn">Record Again</button><button class="use" id="useBtn">Use Recording</button></div>
      <div class="error" id="error"></div>
      <div class="note">Your recording stays in this browser until you choose <b>Use Recording</b>. When connected to the Teacher Builder, it is then returned securely to the ACCESS to Action system.</div>
    </div>
  </div>
<script>
let stream=null,recorder=null,chunks=[],blob=null,startAt=0,timerHandle=null;
const recordBtn=document.getElementById('recordBtn'),player=document.getElementById('player'),actions=document.getElementById('actions'),againBtn=document.getElementById('againBtn'),useBtn=document.getElementById('useBtn'),stateBox=document.getElementById('stateBox'),statusEl=document.getElementById('status'),timerEl=document.getElementById('timer'),errorEl=document.getElementById('error'),taskLabel=document.getElementById('taskLabel');
const qs=new URLSearchParams(location.search);taskLabel.textContent=(qs.get('label')||'Teacher recording').replace(/_/g,' ');
function err(msg){errorEl.textContent=msg;errorEl.style.display='block'}function clearErr(){errorEl.style.display='none';errorEl.textContent=''}
function setState(s){stateBox.className='state'+(s==='recording'?' recording':s==='complete'?' complete':'');statusEl.textContent=s==='recording'?'Recording…':s==='complete'?'Recording complete':'Ready to record';recordBtn.textContent=s==='recording'?'Stop Recording':'Start Recording';recordBtn.className='main'+(s==='recording'?' stop':'')}
function tick(){let sec=Math.floor((Date.now()-startAt)/1000);timerEl.textContent=Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');if(sec>=90&&recorder&&recorder.state==='recording')stopRecording()}
async function startRecording(){clearErr();try{stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];let options={};if(MediaRecorder.isTypeSupported('audio/webm;codecs=opus'))options.mimeType='audio/webm;codecs=opus';recorder=new MediaRecorder(stream,options);recorder.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};recorder.onstop=finishRecording;recorder.start();startAt=Date.now();timerEl.textContent='0:00';timerHandle=setInterval(tick,250);setState('recording');actions.hidden=true;player.hidden=true}catch(e){err('Microphone access is required. Please allow microphone access and try again.')}}
function stopRecording(){if(recorder&&recorder.state==='recording')recorder.stop();if(timerHandle){clearInterval(timerHandle);timerHandle=null}if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}
function finishRecording(){blob=new Blob(chunks,{type:(recorder&&recorder.mimeType)||'audio/webm'});if(!blob.size){err('No audio was captured. Please record again.');setState('ready');return}player.src=URL.createObjectURL(blob);player.hidden=false;actions.hidden=false;setState('complete')}
recordBtn.onclick=()=>{if(recorder&&recorder.state==='recording')stopRecording();else startRecording()};
againBtn.onclick=()=>{if(player.src)URL.revokeObjectURL(player.src);player.removeAttribute('src');player.load();blob=null;chunks=[];actions.hidden=true;player.hidden=true;timerEl.textContent='0:00';setState('ready');startRecording()};
useBtn.onclick=()=>{if(!blob)return;clearErr();useBtn.disabled=true;useBtn.textContent='Saving…';const reader=new FileReader();reader.onerror=()=>{useBtn.disabled=false;useBtn.textContent='Use Recording';err('The recording could not be prepared. Please try again.')};reader.onloadend=()=>{let data=String(reader.result||''),base64=data.includes(',')?data.split(',')[1]:'';if(!base64){reader.onerror();return}if(window.opener&&!window.opener.closed){window.opener.postMessage({type:'A2A_RECORDING',mimeType:blob.type||'audio/webm',base64:base64},'*');statusEl.textContent='Recording sent';stateBox.className='state complete';useBtn.textContent='Saved';setTimeout(()=>window.close(),650)}else{useBtn.disabled=false;useBtn.textContent='Use Recording';err('Return to the Teacher Builder and open the recorder from its Record button. This window was opened by itself, so there is nowhere secure to send the recording.')}};reader.readAsDataURL(blob)};
window.addEventListener('beforeunload',()=>{if(stream)stream.getTracks().forEach(t=>t.stop())});setState('ready');
</script>
</body>
</html>
